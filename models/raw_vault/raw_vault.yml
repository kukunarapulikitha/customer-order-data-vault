version: 2

models:
  - name: hub_customer
    description: One row per unique customer business key (C_CUSTKEY).
    columns:
      - name: CUSTOMER_HK
        description: SHA1 hash of C_CUSTKEY.
        data_tests:
          - unique
          - not_null

  - name: hub_order
    description: One row per unique order business key (O_ORDERKEY).
    columns:
      - name: ORDER_HK
        description: SHA1 hash of O_ORDERKEY.
        data_tests:
          - unique
          - not_null

  - name: link_customer_order
    description: Many-to-one relationship between orders and their customer.
    columns:
      - name: CUSTOMER_ORDER_HK
        data_tests:
          - unique
          - not_null
      - name: CUSTOMER_HK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: CUSTOMER_HK
      - name: ORDER_HK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_order')
                field: ORDER_HK

  - name: sat_customer_details
    description: Descriptive attribute history for each customer_hk.
    columns:
      - name: CUSTOMER_HK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: CUSTOMER_HK

  - name: sat_order_details
    description: Descriptive attribute history for each order_hk.
    columns:
      - name: ORDER_HK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_order')
                field: ORDER_HK
