name: 'tpch_data_vault'
version: '1.0.0'
config-version: 2

profile: 'tpch_data_vault'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# AutomateDV global configuration.
# hash: SHA1 to match the SHA1_BINARY() used in the native Snowflake guide.
# See: https://automate-dv.readthedocs.io/en/latest/best_practises/hashing/
# These must be top-level vars: AutomateDV's macros run inside this project's
# models, so vars scoped under `automate_dv:` are never seen (it silently
# falls back to MD5 and '||').
vars:
  hash: "SHA1"
  concat_string: "^"
  null_placeholder_string: "-1"

# One database per layer, mirroring the native guide's DEV_LZ / DEV_DV / DEV_DW split.
# Schemas are prefixed with the target schema (dev_*, dev_lz_*), so the two
# targets never share incremental tables.
models:
  tpch_data_vault:
    staging:
      +database: DBT_STAGING
      +materialized: view
      +schema: staging
      +tags: ['staging']
    raw_vault:
      +database: DBT_DATA_VAULT
      +materialized: incremental
      +schema: raw_vault
      +tags: ['raw_vault']
    raw_vault_native:           # hand-written vault, no AutomateDV (reconciled against raw_vault)
      +database: DBT_DATA_VAULT
      +materialized: incremental
      +schema: raw_vault_native
      +tags: ['raw_vault_native']
    business_vault:
      +database: DBT_DATA_VAULT
      +schema: business_vault
      +tags: ['business_vault']
    marts:
      +database: DBT_WAREHOUSE
      +materialized: view
      +schema: marts
      +tags: ['marts']
