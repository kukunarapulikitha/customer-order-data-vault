<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Helvetica, Arial, sans-serif">
  <title>Customer-Order Data Vault architecture: sources, Snowflake landing zone, dbt staging, raw vault (AutomateDV and hand-written), business vault, information delivery</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #475569; }
      .layer { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .db { font-size: 11px; font-family: Menlo, Consolas, monospace; fill: #334155; }
      .node { font-size: 12px; fill: #0f172a; }
      .nodeb { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .note { font-size: 10.5px; fill: #475569; }
      .edge { font-size: 10.5px; font-weight: 700; fill: #1d6fb8; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .hub { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.3; }
      .link { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.3; }
      .sat { fill: #fef3c7; stroke: #d97706; stroke-width: 1.3; }
      .flow { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flowBlue { stroke: #1d6fb8; stroke-width: 1.8; fill: none; marker-end: url(#arrowBlue); }
      .flowDash { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1400" height="800" fill="#ffffff"/>

  <text class="title" x="24" y="38">Customer–Order Data Vault 2.0 on dbt Core + Snowflake</text>
  <text class="subtitle" x="24" y="60">Multi-tier Data Vault: Snowpipe lands the data, dbt builds the vault. Raw vault built twice (AutomateDV and hand-written SQL), proven identical by tests.</text>

  <!-- ============ Snowflake account boundary ============ -->
  <rect x="214" y="80" width="1172" height="608" rx="14" fill="none" stroke="#29b5e8" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="230" y="70" width="172" height="22" rx="4" fill="#ffffff"/>
  <text x="240" y="86" font-size="13" font-weight="700" fill="#1d6fb8">❄ Snowflake account</text>

  <!-- ============ Column bands ============ -->
  <rect x="20"   y="100" width="176" height="572" rx="10" fill="#f1f5f9"/>
  <rect x="226"  y="100" width="196" height="572" rx="10" fill="#e0f2fe"/>
  <rect x="436"  y="100" width="196" height="572" rx="10" fill="#e0f7f4"/>
  <rect x="646"  y="100" width="300" height="572" rx="10" fill="#fdf6e7"/>
  <rect x="960"  y="100" width="196" height="572" rx="10" fill="#ecfdf3"/>
  <rect x="1170" y="100" width="204" height="572" rx="10" fill="#f3efff"/>

  <!-- headers -->
  <text class="layer" x="108"  y="128" text-anchor="middle">Source systems</text>
  <text class="db"    x="108"  y="146" text-anchor="middle">files</text>
  <text class="layer" x="324"  y="128" text-anchor="middle">Landing Zone</text>
  <text class="db"    x="324"  y="146" text-anchor="middle">DEV_LZ</text>
  <text class="layer" x="534"  y="128" text-anchor="middle">Staging</text>
  <text class="db"    x="534"  y="146" text-anchor="middle">DBT_STAGING</text>
  <text class="layer" x="796"  y="128" text-anchor="middle">Raw Vault</text>
  <text class="db"    x="796"  y="146" text-anchor="middle">DBT_DATA_VAULT</text>
  <text class="layer" x="1058" y="128" text-anchor="middle">Business Vault</text>
  <text class="db"    x="1058" y="146" text-anchor="middle">DBT_DATA_VAULT</text>
  <text class="layer" x="1272" y="128" text-anchor="middle">Information Delivery</text>
  <text class="db"    x="1272" y="146" text-anchor="middle">DBT_WAREHOUSE</text>

  <!-- ============ 1. Sources ============ -->
  <rect class="box" x="34" y="178" width="148" height="52" rx="7"/>
  <text class="nodeb" x="108" y="199" text-anchor="middle">Customer System</text>
  <text class="note"  x="108" y="216" text-anchor="middle">JSON files</text>
  <rect class="box" x="34" y="258" width="148" height="52" rx="7"/>
  <text class="nodeb" x="108" y="279" text-anchor="middle">Orders System</text>
  <text class="note"  x="108" y="296" text-anchor="middle">CSV files</text>

  <!-- legend -->
  <text class="nodeb" x="34" y="500">Data Vault legend</text>
  <rect class="hub"  x="34" y="512" width="22" height="16" rx="3"/><text class="node" x="64" y="524">Hub: business keys</text>
  <rect class="link" x="34" y="536" width="22" height="16" rx="3"/><text class="node" x="64" y="548">Link: relationships</text>
  <rect class="sat"  x="34" y="560" width="22" height="16" rx="3"/><text class="node" x="64" y="572">Satellite: history</text>
  <line x1="34" y1="596" x2="56" y2="596" class="flowBlue"/><text class="node" x="64" y="600">lz target flow</text>
  <line x1="34" y1="620" x2="56" y2="620" class="flowDash"/><text class="node" x="64" y="624">dev target flow</text>

  <!-- ============ 2. Landing Zone ============ -->
  <rect class="box" x="240" y="170" width="168" height="48" rx="7"/>
  <text class="nodeb" x="324" y="190" text-anchor="middle">Internal stages</text>
  <text class="note"  x="324" y="207" text-anchor="middle">@customer_data · @orders_data</text>

  <rect class="box" x="240" y="262" width="168" height="40" rx="7"/>
  <text class="node" x="324" y="287" text-anchor="middle">stg_customer (VARIANT)</text>
  <rect class="box" x="240" y="310" width="168" height="40" rx="7"/>
  <text class="node" x="324" y="335" text-anchor="middle">stg_orders (columns)</text>
  <text class="note" x="324" y="368" text-anchor="middle">+ ldts · rsrc · filename · row seq</text>

  <!-- dev source -->
  <line x1="240" y1="404" x2="408" y2="404" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <rect class="box" x="240" y="424" width="168" height="62" rx="7"/>
  <text x="324" y="446" text-anchor="middle" font-size="11" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#0f172a">SNOWFLAKE_SAMPLE_DATA</text>
  <text class="note"  x="324" y="462" text-anchor="middle">TPCH_SF1 · customer, orders,</text>
  <text class="note"  x="324" y="476" text-anchor="middle">nation, region</text>
  <text class="note"  x="324" y="506" text-anchor="middle">dev target: batches simulated</text>
  <text class="note"  x="324" y="520" text-anchor="middle">with --vars order_batch /</text>
  <text class="note"  x="324" y="534" text-anchor="middle">customer_limit</text>

  <!-- source -> stage (files), stage -> tables (Snowpipe) -->
  <path class="flowBlue" d="M182,204 L238,194"/>
  <path class="flowBlue" d="M182,284 C210,284 214,210 238,200"/>
  <path class="flowBlue" d="M324,218 L324,258"/>
  <text class="edge" x="332" y="243">Snowpipe</text>

  <!-- ============ 3. Staging ============ -->
  <rect class="box" x="450" y="170" width="168" height="54" rx="7"/>
  <text class="node" x="534" y="191" text-anchor="middle">base_customer · base_orders</text>
  <text class="note" x="534" y="208" text-anchor="middle">audit cols · switch on target</text>

  <rect class="box" x="450" y="250" width="168" height="54" rx="7"/>
  <text class="node" x="534" y="271" text-anchor="middle">stg_customer · stg_orders</text>
  <text class="note" x="534" y="288" text-anchor="middle">automate_dv.stage()</text>

  <rect class="box" x="450" y="330" width="168" height="54" rx="7"/>
  <text class="node" x="534" y="351" text-anchor="middle">stg_*_native</text>
  <text class="note" x="534" y="368" text-anchor="middle">dv_hash() macro</text>
  <text class="note" x="534" y="406" text-anchor="middle">SHA1 hash keys + hashdiffs</text>

  <rect class="box" x="450" y="560" width="168" height="54" rx="7"/>
  <text class="node" x="534" y="581" text-anchor="middle">ref_nation · ref_region</text>
  <text class="note" x="534" y="598" text-anchor="middle">static reference data</text>

  <!-- LZ -> base (lz), sample -> base (dev), sample -> ref -->
  <path class="flowBlue" d="M408,300 C430,300 428,200 448,197"/>
  <path class="flowDash" d="M408,448 C436,448 424,212 448,210"/>
  <path class="flowDash" d="M408,470 C438,470 424,587 448,587"/>
  <!-- base -> stg, base -> native -->
  <path class="flow" d="M534,224 L534,247"/>
  <path class="flow" d="M618,197 C640,197 640,357 620,357"/>

  <!-- ============ 4. Raw Vault ============ -->
  <rect x="654" y="158" width="284" height="168" rx="9" fill="#fffdf7" stroke="#d6b87a" stroke-width="1"/>
  <text class="nodeb" x="796" y="172" text-anchor="middle">AutomateDV</text>
  <rect class="hub" x="660" y="182" width="136" height="36" rx="6"/>
  <text class="node" x="728" y="205" text-anchor="middle">hub_customer</text>
  <rect class="hub" x="806" y="182" width="126" height="36" rx="6"/>
  <text class="node" x="869" y="205" text-anchor="middle">hub_order</text>
  <rect class="link" x="706" y="232" width="180" height="36" rx="6"/>
  <text class="node" x="796" y="255" text-anchor="middle">link_customer_order</text>
  <rect class="sat" x="660" y="282" width="136" height="36" rx="6"/>
  <text class="node" x="728" y="305" text-anchor="middle">sat_customer_details</text>
  <rect class="sat" x="806" y="282" width="126" height="36" rx="6"/>
  <text class="node" x="869" y="305" text-anchor="middle">sat_order_details</text>
  <text class="note" x="796" y="338" text-anchor="middle">incremental · insert-only · idempotent</text>

  <!-- reconciliation -->
  <rect x="686" y="352" width="220" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="796" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">≡ 7 reconciliation tests</text>
  <text class="note" x="796" y="398" text-anchor="middle">EXCEPT both ways · row-for-row identical</text>

  <rect x="654" y="412" width="284" height="150" rx="9" fill="#fffdf7" stroke="#d6b87a" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="nodeb" x="796" y="428" text-anchor="middle">Hand-written SQL (no package)</text>
  <rect class="hub" x="660" y="438" width="136" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="node" x="728" y="458" text-anchor="middle">hub_customer_native</text>
  <rect class="hub" x="806" y="438" width="126" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="node" x="869" y="458" text-anchor="middle">hub_order_native</text>
  <rect class="link" x="706" y="480" width="180" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="node" x="796" y="500" text-anchor="middle">link_customer_order_native</text>
  <rect class="sat" x="660" y="522" width="136" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="node" x="728" y="542" text-anchor="middle">sat_customer_…_native</text>
  <rect class="sat" x="806" y="522" width="126" height="32" rx="6" stroke-dasharray="4 3"/>
  <text class="node" x="869" y="542" text-anchor="middle">sat_order_…_native</text>

  <!-- stg -> vault -->
  <path class="flow" d="M618,277 C640,277 640,250 656,210"/>
  <path class="flow" d="M618,370 C636,370 634,454 651,454"/>

  <!-- ============ 5. Business Vault ============ -->
  <rect class="sat" x="974" y="176" width="168" height="48" rx="6"/>
  <text class="node" x="1058" y="196" text-anchor="middle">bv_sat_customer</text>
  <text class="note" x="1058" y="213" text-anchor="middle">+ nation / region names</text>
  <rect class="sat" x="974" y="236" width="168" height="48" rx="6"/>
  <text class="node" x="1058" y="256" text-anchor="middle">bv_sat_order</text>
  <text class="note" x="1058" y="273" text-anchor="middle">+ Tier-1/2/3 priority rule</text>
  <rect class="box" x="974" y="310" width="168" height="36" rx="6"/>
  <text class="node" x="1058" y="333" text-anchor="middle">as_of_dates (daily spine)</text>
  <rect class="box" x="974" y="358" width="168" height="48" rx="6"/>
  <text class="node" x="1058" y="378" text-anchor="middle">pit_customer</text>
  <text class="note" x="1058" y="395" text-anchor="middle">point-in-time pointers</text>

  <!-- vault -> BV, ref -> BV -->
  <path class="flow" d="M938,262 L970,260"/>
  <path class="flow" d="M938,200 L970,200"/>
  <path class="flow" d="M618,592 C700,650 930,650 952,590 L952,232 Q952,214 970,214"/>
  <path class="flow" d="M1058,346 L1058,355"/>

  <!-- ============ 6. Information Delivery ============ -->
  <rect class="box" x="1184" y="176" width="176" height="44" rx="7"/>
  <text class="nodeb" x="1272" y="196" text-anchor="middle">dim_customer</text>
  <text class="note"  x="1272" y="212" text-anchor="middle">current row per customer</text>
  <rect class="box" x="1184" y="236" width="176" height="44" rx="7"/>
  <text class="nodeb" x="1272" y="256" text-anchor="middle">dim_order</text>
  <text class="note"  x="1272" y="272" text-anchor="middle">current row + tier bucket</text>
  <rect class="box" x="1184" y="296" width="176" height="44" rx="7"/>
  <text class="nodeb" x="1272" y="316" text-anchor="middle">fct_customer_order</text>
  <text class="note"  x="1272" y="332" text-anchor="middle">factless fact (link + hubs)</text>

  <rect x="1184" y="382" width="176" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text class="node" x="1272" y="402" text-anchor="middle">orders_by_region_tier</text>
  <text class="note" x="1272" y="418" text-anchor="middle">dbt analysis</text>

  <!-- BV -> marts, vault -> fct, marts -> analysis -->
  <path class="flow" d="M1142,200 L1180,198"/>
  <path class="flow" d="M1142,260 L1180,258"/>
  <path class="flow" d="M938,297 L1150,297 C1166,297 1168,318 1181,318"/>
  <path class="flow" d="M1272,340 L1272,379"/>

  <text class="note" x="1272" y="470" text-anchor="middle">Consumers: BI, analysts,</text>
  <text class="note" x="1272" y="484" text-anchor="middle">data science</text>

  <!-- ============ dbt Core orchestration bar ============ -->
  <rect x="226" y="704" width="1148" height="72" rx="10" fill="#fff4ee" stroke="#ff694b" stroke-width="1.5"/>
  <text x="246" y="731" font-size="15" font-weight="700" fill="#c2410c">dbt Core</text>
  <text class="node" x="330" y="731">compiles Jinja + SQL, runs it in Snowflake, tests it:</text>
  <text x="246" y="756" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0f172a">dbt build   ·   dbt build --target lz   ·   dbt source freshness --target lz   ·   dbt docs generate</text>
  <text class="note" x="1360" y="731" text-anchor="end">46 data tests · PK/FK · tier rule · reconciliation</text>
  <text class="note" x="1360" y="756" text-anchor="end">AutomateDV 0.11.5 · dbt_utils 1.4</text>
  <path d="M800,688 L800,702" stroke="#ff694b" stroke-width="1.5"/>
</svg>
